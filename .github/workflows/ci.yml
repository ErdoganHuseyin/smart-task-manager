# Runs the full test suite on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker that is already installed on the runner.
      # The tests mock Claude, so no ANTHROPIC_API_KEY is needed here.
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # Checks that the Docker image builds and that the app really starts in it.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image and start the app with PostgreSQL
        run: docker compose --profile app up -d --build

      - name: Wait until /actuator/health answers UP
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "App is healthy"; exit 0
            fi
            sleep 3
          done
          echo "App did not become healthy"; docker compose --profile app logs app; exit 1

      - name: Stop containers
        if: always()
        run: docker compose --profile app down
