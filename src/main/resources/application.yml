spring:
  application:
    name: smart-task-manager

  # Values can be overridden with environment variables, e.g. DB_URL=...
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # In production, ALWAYS set JWT_SECRET to a long random value (at least 32 bytes).
    # The default below is for local development only.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:1h}

  ai:
    # Your own key from console.anthropic.com. NEVER write it here: set the environment variable.
    # Without a key the app still runs; only the AI endpoints answer 503.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    time-zone: ${AI_TIME_ZONE:Europe/Istanbul}
    # Ignored for Haiku models, which do not support server-side fallbacks.
    fallbacks: ${AI_FALLBACKS:true}
